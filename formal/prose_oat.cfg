\* TLC model-checking configuration for the PROSE Object Admission Transaction.
\*
\* Run:  tlc2 -config prose_oat.cfg prose_oat.tla
\*   or open prose_oat.tla in the TLA+ Toolbox and use this as the model.
\*
\* The finite instance below is small enough to check exhaustively in seconds
\* yet large enough to exercise a reuse race: two objects, two generations each,
\* two slots, and up to two concurrent pins on one (id,g).

SPECIFICATION Spec

CONSTANTS
    ObjectIds   = {o1, o2}
    Generations = {g0, g1}
    Slots       = {s0, s1}
    MaxPins     = 2

INVARIANT TypeOK
INVARIANT InvTransferBinding
INVARIANT InvZeroRPE
INVARIANT InvPinBounded

\* TLC configuration for the consult-then-CAS OAT model.
\*
\* Run:  tlc2 -config prose_oat_cas.cfg prose_oat_cas.tla
\*
\* Two objects and two generations are enough to exercise the reviewer's
\* interleaving (advisory read, update commits, CAS rejects) and the
\* pending-reclaim drain (CAS succeeds, update pends, drain commits).

SPECIFICATION Spec

CONSTANTS
    ObjectIds   = {o1, o2}
    Generations = {g0, g1}
    MaxPins     = 2

INVARIANT TypeOK
INVARIANT InvTransferBinding
INVARIANT InvZeroRPE
INVARIANT InvPendingBlocksPins
INVARIANT InvPinBounded
